name: build-apk

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain (JDK 17 + Android SDK 35 + Gradle 8.10.2)
        shell: bash
        run: |
          set -eo pipefail
          # JDK 17 co san tren runner, khong dung action ngoai.
          if [ -n "${JAVA_HOME_17_X64:-}" ] && [ -x "${JAVA_HOME_17_X64}/bin/java" ]; then
            echo "JAVA_HOME=${JAVA_HOME_17_X64}" >> "$GITHUB_ENV"
            echo "${JAVA_HOME_17_X64}/bin" >> "$GITHUB_PATH"
          fi
          java -version

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "BT=$SDK/build-tools/35.0.0" >> "$GITHUB_ENV"
          test -d "$SDK"

          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" > /dev/null

          GV=8.10.2
          curl -sSL "https://services.gradle.org/distributions/gradle-${GV}-bin.zip" -o "$RUNNER_TEMP/gradle.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-${GV}/bin" >> "$GITHUB_PATH"

      - name: Decode signing key if present
        shell: bash
        env:
          RK_KEYSTORE_B64: ${{ secrets.RK_KEYSTORE_B64 }}
        run: |
          set -eo pipefail
          if [ -n "$RK_KEYSTORE_B64" ]; then
            printf '%s' "$RK_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/rk.jks"
            echo "RK_KEYSTORE_FILE=$RUNNER_TEMP/rk.jks" >> "$GITHUB_ENV"
            echo "SIGNING=release-key-from-secret" >> "$GITHUB_ENV"
          else
            echo "SIGNING=debug-key-fallback" >> "$GITHUB_ENV"
            echo "No RK_KEYSTORE_B64 secret: APK will be signed with the CI debug key."
          fi

      - name: Build release APK
        shell: bash
        env:
          RK_KEYSTORE_PASSWORD: ${{ secrets.RK_KEYSTORE_PASSWORD }}
          RK_KEY_ALIAS: ${{ secrets.RK_KEY_ALIAS }}
          RK_KEY_PASSWORD: ${{ secrets.RK_KEY_PASSWORD }}
        run: |
          set -eo pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Prove the APK has no INTERNET permission
        shell: bash
        run: |
          set -eo pipefail
          APK=$(find app/build/outputs/apk -name '*.apk' | head -1)
          echo "APK: $APK"
          "$BT/aapt2" dump xmltree "$APK" --file AndroidManifest.xml > manifest-tree.txt
          echo "--- permissions in the shipped APK ---"
          grep -o 'android.permission.[A-Z_]*' manifest-tree.txt | sort -u | tee permissions.txt
          echo "--- merged manifest cross-check ---"
          grep -i 'uses-permission' app/build/outputs/logs/manifest-merger-release-report.txt || true
          if grep -q 'android.permission.INTERNET' manifest-tree.txt; then
            echo "FAIL: APK requests INTERNET."
            exit 1
          fi
          if grep -qi 'android.permission.INTERNET' app/build/outputs/logs/manifest-merger-release-report.txt; then
            echo "FAIL: merged manifest contains INTERNET."
            exit 1
          fi
          echo "PASS: no INTERNET permission in APK nor in merged manifest."

      - name: Hashes and signer certificate
        shell: bash
        run: |
          set -eo pipefail
          APK=$(find app/build/outputs/apk -name '*.apk' | head -1)
          mkdir -p dist
          OUT="dist/RecallKeeper-1.0.0-build${{ github.run_number }}.apk"
          cp "$APK" "$OUT"
          {
            echo "file: $(basename "$OUT")"
            echo "bytes: $(stat -c%s "$OUT")"
            echo "sha256: $(sha256sum "$OUT" | cut -d' ' -f1)"
            echo "sha1: $(sha1sum "$OUT" | cut -d' ' -f1)"
            echo "signing: $SIGNING"
            echo "commit: ${{ github.sha }}"
            echo ""
            "$BT/apksigner" verify --print-certs "$OUT"
          } | tee dist/HASHES.txt
          cp permissions.txt dist/PERMISSIONS.txt

      - name: Publish release with the APK attached
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', github.run_number) }}
        run: |
          set -eo pipefail
          gh release create "$TAG" dist/* \
            --title "Recall Keeper 1.0.0 (build ${{ github.run_number }})" \
            --notes "APK sideload. Doi chieu SHA-256 va chu ky trong HASHES.txt. PERMISSIONS.txt chung minh APK khong co quyen INTERNET. Bao cao: docs/REPORT.md trong repo."

      - name: Publish build log if anything failed
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p fail
          if [ -f build.log ]; then tail -c 200000 build.log > fail/build.log; else echo "no build.log" > fail/build.log; fi
          gh release create "failed-${{ github.run_number }}" fail/build.log \
            --title "Build log (run ${{ github.run_number }})" \
            --notes "Log loi de doi chieu." --prerelease || true
